# ==============================================================================
# VIRTUAL HOST CHO TOMATODEV.ME (CLOUDFLARE TUNNEL -> NGINX -> NEXT.JS)
# Vị trí: docker/nginx/conf.d/default.conf
# SSL được xử lý hoàn toàn tự động tại tầng Cloudflare Edge (Universal SSL).
# Cloudflare Tunnel (cloudflared) chuyển tiếp lưu lượng sạch vào http://nginx:80.
# ==============================================================================

upstream nextjs_upstream {
    server profile-app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name tomatodev.me www.tomatodev.me _;

    # Endpoint kiểm tra sức khỏe nhanh cho Docker Healthcheck
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Cache tĩnh siêu tốc cho _next/static
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Bảo vệ các API bằng Rate Limit tầng Nginx
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # Chuyển tiếp toàn bộ request vào Next.js Standalone
    location / {
        limit_req zone=page_limit burst=40 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
    }
}
