# ==============================================================================
# VIRTUAL HOST CHO TOMATODEV.ME (CLOUDFLARE TUNNEL -> NGINX -> NEXT.JS)
# Vị trí: docker/nginx/conf.d/default.conf
# SSL được xử lý hoàn toàn tự động tại tầng Cloudflare Edge (Universal SSL).
# Cloudflare Tunnel (cloudflared) chuyển tiếp lưu lượng sạch vào http://nginx:80.
# ==============================================================================

upstream nextjs_upstream {
    server profile-app:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name tomatodev.me www.tomatodev.me _;

    # Endpoint kiểm tra sức khỏe nhanh cho Docker Healthcheck
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Cache tĩnh siêu tốc cho _next/static (Thời hạn 1 năm, không log)
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Bảo vệ các API bằng Rate Limit & Conn Limit tầng Nginx (Không cache để dữ liệu luôn tươi mới)
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 15;

        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $client_real_ip;

        # Timeout upstream chặt chẽ chống treo socket
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Chuyển tiếp toàn bộ request vào Next.js Standalone kèm Microcaching bảo vệ SSR
    location / {
        limit_req zone=page_limit burst=40 nodelay;
        limit_conn conn_limit 30;

        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $client_real_ip;

        # Microcaching bảo vệ Next.js khỏi L7 HTTP Flood:
        # Cache 2s cho mã 200, phân tách rõ HTML thường và RSC payload qua header $http_rsc
        proxy_cache MICROCACHE;
        proxy_cache_key "$scheme$request_method$host$request_uri$http_rsc";
        proxy_cache_valid 200 2s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_lock_age 2s;
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
        add_header X-Cache-Status $upstream_cache_status;

        # Timeout upstream chặt chẽ
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
