# ==============================================================================
# CẤU HÌNH GỐC NGINX REVERSE PROXY ĐÃ GIA CỐ (TOMATODEVS PROFILE - HOMELAB)
# Vị trí: docker/nginx/nginx.conf
# Bảo vệ chống: Volumetric DDoS, Slowloris, và L7 CPU/RAM Resource Exhaustion
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 1. Ẩn phiên bản Nginx trên HTTP Header và trang lỗi (Bảo mật chống dò quét)
    server_tokens off;

    # 2. Khôi phục IP thật của người dùng:
    # CỰC KỲ QUAN TRỌNG: Phải tin cậy dải mạng nội bộ Docker (172.16.0.0/12)
    # vì lưu lượng từ Internet đi qua tomatodevs-tunnel (IP Docker) trước khi vào Nginx.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # Các dải IP Anycast của Cloudflare Edge (IPv4 & IPv6)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # 3. Trích xuất IP Client an toàn tuyệt đối:
    # Ưu tiên CF-Connecting-IP, fallback sang $remote_addr nếu gọi nội bộ (Tailscale/LAN)
    map $http_cf_connecting_ip $client_real_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    # Hỗ trợ Connection Upgrade cho WebSockets / HTTP 1.1 Keepalive
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # Bỏ ghi access log cho các mã 429 khi bị flood để bảo vệ Disk I/O trên máy chủ
    map $status $log_drop {
        429     0;
        default 1;
    }

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" client_ip="$client_real_ip" '
                    'rt=$request_time cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log main buffer=64k flush=5s if=$log_drop;

    # 4. Tối ưu hóa I/O & TCP
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;

    # 5. Bộ tham số chống tấn công Slowloris & Giữ kết nối chậm
    # Đóng kết nối nhanh nếu client gửi header/body quá chậm
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    # Giải phóng ngay socket TCP khi timeout, không giữ trạng thái FIN_WAIT
    reset_timedout_connection on;

    # Giới hạn kích thước header/body chống tràn bộ nhớ RAM
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_max_body_size 10m;

    # 6. Nén Gzip tiết kiệm băng thông
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 7. Rate Limiting & Connection Limiting chính xác theo $client_real_ip
    # (KHÔNG DÙNG $binary_remote_addr để tránh Self-DoS với Cloudflare Tunnel)
    limit_req_zone $client_real_ip zone=api_limit:10m rate=60r/m;
    limit_req_zone $client_real_ip zone=page_limit:10m rate=20r/s;
    limit_conn_zone $client_real_ip zone=conn_limit:10m;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # 8. Microcache Zone trong RAM (Lưu trữ và hấp thụ L7 HTTP Flood tới Next.js)
    proxy_cache_path /var/cache/nginx/microcache levels=1:2 keys_zone=MICROCACHE:10m max_size=100m inactive=60m use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
